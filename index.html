<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Letter for Matty's Mom 💌</title>
<meta name="theme-color" content="#3a1519">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#2a0f12; --wine:#4a1f22; --wine2:#7a3038;
  --cream:#f1e6d3; --paper:#ead9bd; --gold:#c9a36b;
  --sun:#f2b84b; --coral:#e0704f; --leaf:#6b8f5e; --rose:#d98a8f;
  --ink:#3a1c1e;
  --head:'Playfair Display',Georgia,serif;
  --script:'Dancing Script','Brush Script MT',cursive;
  --body:'Lora',Georgia,serif;
  --ui:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--night);line-height:1.8;overflow-x:hidden}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}

/* ============ BACKGROUND (image placeholders at the bottom in CONFIG) ============ */
.bg{position:fixed;inset:-10% 0;z-index:-2;
  background:
   radial-gradient(ellipse at 75% 15%,#7a3038 0,transparent 50%),
   radial-gradient(ellipse at 15% 85%,#5a2328 0,transparent 55%),
   linear-gradient(180deg,#2a0f12,#3a1519 60%,#2a0f12);
  background-size:cover;background-position:center;will-change:transform}
.bg.img{background-image:var(--bg1)}
.bg-tint{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(42,15,18,.55),rgba(42,15,18,.78));pointer-events:none}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.heart,.spark{position:absolute;bottom:-40px;animation:rise linear infinite;opacity:0}
.heart{color:var(--rose);filter:drop-shadow(0 0 6px #d98a8f88)}
.spark{width:6px;height:6px;border-radius:50%;background:var(--sun);box-shadow:0 0 12px 4px #f2b84b99}
@keyframes rise{0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}12%{opacity:.85}
  50%{transform:translateY(-55vh) translateX(22px) scale(1)}100%{transform:translateY(-115vh) translateX(-18px) scale(.8);opacity:0}}
.burst{position:fixed;z-index:60;pointer-events:none;font-size:22px;animation:pop 1.4s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(1.4) rotate(var(--r));opacity:0}}

/* ============ TOP BAR / LANGUAGE TOGGLE ============ */
.top{position:fixed;top:14px;inset-inline:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.toggle{pointer-events:auto;position:relative;display:grid;grid-template-columns:1fr 1fr;width:178px;padding:4px;border-radius:99px;
  background:rgba(42,15,18,.7);backdrop-filter:blur(10px);border:1.5px solid var(--gold);box-shadow:0 6px 20px #0006}
.toggle button{position:relative;z-index:1;border:0;background:none;color:var(--cream);font:700 .85rem var(--ui);padding:8px 0;border-radius:99px;cursor:pointer;transition:color .3s}
.toggle button[aria-pressed=true]{color:var(--night)}
.knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:linear-gradient(135deg,var(--sun),var(--coral));
  transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.toggle[data-l=es] .knob{transform:translateX(100%)}

/* ============ HERO ============ */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;padding:90px 22px 130px;color:var(--cream);overflow:hidden}
.moon{position:absolute;top:12%;right:9%;width:clamp(70px,16vw,130px);aspect-ratio:1;border-radius:50%;box-shadow:inset -28px 8px 0 0 var(--cream);transform:rotate(-20deg);animation:bob 7s ease-in-out infinite;opacity:.9}
.sun{position:absolute;top:10%;left:7%;width:clamp(60px,13vw,110px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#ffe29a 0,var(--sun) 55%,transparent 72%);filter:blur(1px);animation:glow 4s ease-in-out infinite;opacity:.85}
@keyframes bob{50%{transform:rotate(-12deg) translateY(-14px)}}
@keyframes glow{50%{transform:scale(1.15);opacity:1}}
.star{position:absolute;color:var(--gold);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
.eyebrow{font:700 .8rem var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--sun);margin-bottom:14px}
.hero h1{font-family:var(--head);font-size:clamp(2.4rem,9vw,5.2rem);line-height:1.08;color:#f08a63;text-shadow:0 3px 0 #0005}
.hero h1 em{display:block;font-family:var(--script);font-style:normal;font-weight:700;color:var(--cream);font-size:.7em;margin-top:6px}
.seal{position:relative;margin:38px auto 0;width:128px;height:128px;border:0;background:none;cursor:pointer;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}
.seal .disc{position:absolute;inset:0;border-radius:47% 53% 50% 50%/52% 48% 52% 48%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#a03c45,#5a1a22 70%);box-shadow:inset 0 0 0 6px #6a2029,inset 0 0 0 8px #c9a36b66,0 12px 24px #000a;
  font:700 3.4rem var(--script);color:var(--gold);text-shadow:0 2px 3px #000a;transition:transform .4s}
.seal:hover .disc{transform:scale(1.1) rotate(-8deg)}
.seal::before,.seal::after{content:"";position:absolute;bottom:-44px;width:34px;height:70px;background:#5a1a22;z-index:-1;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.seal::before{left:26px;transform:rotate(12deg)}.seal::after{right:26px;transform:rotate(-12deg)}
.hint{margin-top:64px;font:600 .9rem var(--ui);opacity:.85;animation:nudge 2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(6px)}}
.torn-b{position:absolute;left:0;right:0;bottom:-1px;height:54px;background:var(--cream);
  clip-path:polygon(0 60%,3% 30%,6% 70%,10% 40%,14% 75%,18% 35%,23% 70%,28% 30%,33% 65%,38% 35%,43% 75%,48% 40%,53% 70%,58% 30%,63% 65%,68% 35%,73% 75%,78% 40%,83% 70%,88% 30%,93% 70%,97% 40%,100% 65%,100% 100%,0 100%)}

/* ============ LETTER ============ */
.stage{position:relative;z-index:1;background:linear-gradient(180deg,var(--cream),#e7d3b3 55%,var(--cream));padding:40px 16px 90px}
.stage::before,.stage::after{content:"❀";position:absolute;font-size:9rem;color:var(--wine);opacity:.06;pointer-events:none}
.stage::before{top:30px;left:-20px}.stage::after{bottom:30px;right:-20px;content:"✿"}
.photo{display:none;max-width:560px;margin:0 auto 34px;border:10px solid #fff;box-shadow:0 14px 30px #3a1c1e55;transform:rotate(-2deg);
  aspect-ratio:4/3;background:#ddd center/cover}
.photo.show{display:block}
.letter{position:relative;max-width:720px;margin:0 auto;padding:46px 26px 40px;border-radius:6px;
  background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.05)),var(--paper);
  box-shadow:0 18px 40px #3a1c1e55,inset 0 0 60px #b9976244;
  background-image:repeating-linear-gradient(0deg,transparent 0 33px,#7a303818 33px 34px)}
.letter::before{content:"";position:absolute;inset:10px;border:2px double #7a3038aa;border-radius:3px;pointer-events:none}
.stamp{position:absolute;top:-26px;inset-inline-end:22px;width:88px;padding:8px;transform:rotate(7deg);text-align:center;color:var(--wine);
  background:radial-gradient(circle at 7px 7px,transparent 4px,#f6ecda 4.6px) -3px -3px/14px 14px;filter:drop-shadow(0 4px 5px #0006);font:700 .62rem var(--ui);letter-spacing:.1em}
.stamp b{display:block;font:700 1.9rem var(--head);line-height:1}
.stamp i{display:block;font-style:normal;font-size:1.6rem;margin-bottom:2px}
.greet{font-family:var(--script);font-weight:700;color:var(--wine);font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.25;margin-bottom:22px;padding-inline-end:70px}
.letter p.para{font-size:clamp(1.02rem,3.6vw,1.12rem);margin-bottom:20px;text-align:start}
.letter p.para:first-of-type::first-letter{font:700 3.4rem/.8 var(--head);float:inline-start;margin:6px 10px 0 0;color:var(--coral)}
[dir=rtl] .letter p.para:first-of-type::first-letter{margin:6px 0 0 10px}
.sign{margin-top:30px;text-align:end}
.sign small{display:block;font-style:italic;color:var(--wine2)}
.sign strong{display:block;font:700 clamp(1.7rem,6vw,2.3rem) var(--script);color:var(--wine);margin-top:4px}
.sign .heartbeat{display:inline-block;color:var(--coral);animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}20%{transform:scale(1.3)}40%{transform:scale(1.1)}}
.tax{display:inline-block;background:linear-gradient(transparent 62%,#f2b84b88 62%);padding:0 3px}
.band{display:flex;justify-content:center;gap:10px;margin-top:34px;font-size:1.5rem;flex-wrap:wrap}
.band span{display:inline-block;animation:sway 3s ease-in-out infinite}
.band span:nth-child(2n){animation-delay:-1s}.band span:nth-child(3n){animation-delay:-2s}
@keyframes sway{50%{transform:translateY(-8px) rotate(8deg)}}
.final{text-align:center;margin-top:36px}
.btn{font:800 .95rem var(--ui);border:0;cursor:pointer;color:var(--night);padding:14px 26px;border-radius:99px;background:linear-gradient(135deg,var(--sun),var(--coral));
  box-shadow:0 6px 0 #9c4630,0 10px 20px #0004;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px) rotate(-1deg)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c4630}

/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
.switching{animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}

@media(min-width:760px){.letter{padding:64px 66px 56px}.stage{padding-top:60px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="bg-tint" aria-hidden="true"></div>
<div class="fx" id="fx" aria-hidden="true"></div>

<div class="top">
  <div class="toggle" id="toggle" data-l="en" role="group" aria-label="Language / Idioma">
    <span class="knob" aria-hidden="true"></span>
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="es" aria-pressed="false">Español</button>
  </div>
</div>

<header class="hero">
  <div class="sun" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div>
  <div id="stars" aria-hidden="true"></div>
  <div>
    <p class="eyebrow" data-k="eyebrow">A letter from the heart</p>
    <h1><span data-k="title1">For the most wonderful</span><em data-k="title2">Mom of Matty</em></h1>
    <button class="seal" id="seal" type="button" aria-label="Open the letter"><span class="disc" aria-hidden="true">M</span></button>
    <p class="hint" data-k="hint">Tap the seal to open ↓</p>
  </div>
  <div class="torn-b" aria-hidden="true"></div>
</header>

<main class="stage" id="letter-stage">
  <!-- OPTIONAL PHOTO: set CONFIG.photo below (e.g. 'image2.png') -->
  <div class="photo rv" id="photo" role="img" aria-label="Photo"></div>
  <article class="letter rv" id="letter" aria-live="polite">
    <div class="stamp" aria-hidden="true"><i>☀️</i><b>EC</b>ECUADOR</div>
    <h2 class="greet" id="greet"></h2>
    <div id="paras"></div>
    <div class="band" aria-hidden="true"><span>🌸</span><span>☀️</span><span>🌿</span><span>💛</span><span>🌺</span><span>🦋</span><span>🌄</span></div>
    <div class="sign"><small id="withLove"></small><strong id="who"></strong><span class="heartbeat" aria-hidden="true">❤</span></div>
    <div class="final"><button class="btn" id="hugBtn" type="button"></button></div>
  </article>
</main>

<script>
/* ======================= CONFIG — EDIT HERE =======================
   Put your images next to this file and use these names (or change them).
   Any image left empty/missing is simply skipped — the page still looks great. */
const CONFIG={
  bg1:'bg1.jpg',        // ← full-page background (parallax)  e.g. 'bg1.jpg'
  photo:'image2.png',   // ← optional framed photo above the letter e.g. 'image2.png'
  signature:"Matty's lovers"   // ← sign-off name(s)
};

/* ======================= THE MESSAGE ======================= */
const MSG={
 en:{
  eyebrow:'A letter from the heart',title1:'For the most wonderful',title2:'Mom of Matty',hint:'Tap the seal to open ↓',
  greet:"To the dearest and most wonderful mother, Matty’s mom,",
  paras:[
   "I am writing this message to express my deepest love, gratitude, and immense respect for you. Knowing Matty is truly one of the greatest blessings in my life. He is such an incredible, kind-hearted friend, and I know without a doubt that his noble character is a reflection of your wonderful upbringing and endless love.",
   "Your family holds a very special place in my heart, and honestly, my love doesn't just stop with your beautiful family—I have fallen completely in love with the entirety of Ecuador! It is such a vibrant and beautiful country that brings forth souls as warm and joyful as yours. In fact, I love Ecuador and your family so much that I'm genuinely worried immigration will charge me an <span class=\"tax\">“extra love tax”</span> the next time I visit!",
   "I wish you endless health, happiness, and peace. May you always remain the bright light that illuminates your beautiful family. All my respect, admiration, and biggest hugs to you and to the amazing nation of Ecuador."
  ],
  withLove:'With all my love and respect,',hug:'Send a giant hug 🤗',title:'A Letter for Matty’s Mom 💌',seal:'Open the letter'
 },
 es:{
  eyebrow:'Una carta desde el corazón',title1:'Para la madre más maravillosa',title2:'La mamá de Matty',hint:'Toca el sello para abrir ↓',
  greet:"Para la madre más querida y maravillosa, la mamá de Matty:",
  paras:[
   "Le escribo este mensaje para expresarle mi más profundo amor, gratitud y un inmenso respeto. Conocer a Matty es, de verdad, una de las mayores bendiciones de mi vida. Él es un amigo increíble y de gran corazón, y sé sin duda alguna que su noble forma de ser es el reflejo de su maravillosa crianza y de su amor infinito.",
   "Su hermosa familia tiene un lugar muy especial en mi corazón, y para ser honesto, mi cariño no se detiene solo en ustedes, ¡me he enamorado por completo de todo el Ecuador! Es un país tan hermoso y lleno de vida que da al mundo almas tan cálidas y alegres como las suyas. De hecho, amo tanto a su familia y a Ecuador que me preocupa seriamente que la aduana me quiera cobrar un <span class=\"tax\">“impuesto por exceso de amor”</span> la próxima vez que vaya a visitarlos.",
   "Le deseo infinita salud, felicidad y paz. Que siga siendo siempre esa luz brillante que ilumina a su hermosa familia. Todo mi respeto, admiración y un abrazo gigante para usted y para ese gran país que es Ecuador."
  ],
  withLove:'Con todo mi cariño y respeto,',hug:'Enviar un abrazo gigante 🤗',title:'Una carta para la mamá de Matty 💌',seal:'Abrir la carta'
 }
};

/* ======================= LOGIC ======================= */
let lang='en';
try{lang=localStorage.getItem('mlang')||((navigator.language||'').startsWith('es')?'es':'en')}catch(e){}
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function render(animate){
  const m=MSG[lang];
  document.documentElement.lang=lang;document.title=m.title;
  document.querySelectorAll('[data-k]').forEach(n=>n.textContent=m[n.dataset.k]);
  $('#greet').textContent=m.greet;
  $('#paras').innerHTML=m.paras.map(p=>`<p class="para">${p}</p>`).join('');
  $('#withLove').textContent=m.withLove;$('#who').textContent=CONFIG.signature;
  $('#hugBtn').textContent=m.hug;$('#seal').setAttribute('aria-label',m.seal);
  $('#toggle').dataset.l=lang;
  document.querySelectorAll('.toggle button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  if(animate){const l=$('#letter');l.classList.remove('switching');void l.offsetWidth;l.classList.add('switching')}
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{
  if(lang===b.dataset.lang)return;lang=b.dataset.lang;try{localStorage.setItem('mlang',lang)}catch(e){}render(true)});

/* images (graceful) */
function tryImg(src,ok){if(!src)return;const i=new Image();i.onload=()=>ok(src);i.src=src}
tryImg(CONFIG.bg1,s=>{const bg=$('#bg');bg.style.setProperty('--bg1',`url("${s}")`);bg.classList.add('img')});
tryImg(CONFIG.photo,s=>{const p=$('#photo');p.style.backgroundImage=`url("${s}")`;p.classList.add('show')});

/* parallax */
if(!reduce)addEventListener('scroll',()=>{$('#bg').style.transform=`translateY(${scrollY*-.08}px)`},{passive:true});

/* floating hearts + sparks */
(()=>{const fx=$('#fx'),n=innerWidth<600?14:26;
 for(let i=0;i<n;i++){const e=document.createElement('span');
  if(i%3===0){e.className='spark'}else{e.className='heart';e.textContent=['❤','♥','💛','🌸'][i%4];e.style.fontSize=(12+Math.random()*18)+'px'}
  e.style.left=Math.random()*100+'%';e.style.animationDuration=(9+Math.random()*10)+'s';e.style.animationDelay=(-Math.random()*14)+'s';fx.appendChild(e)}})();
/* stars */
(()=>{const s=$('#stars');for(let i=0;i<22;i++){const e=document.createElement('span');e.className='star';e.textContent=i%3?'✦':'✧';
 e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*80}%;font-size:${8+Math.random()*14}px;animation-delay:${Math.random()*3}s`;s.appendChild(e)}})();

/* heart burst */
function burst(x,y,n=16){if(reduce)return;for(let i=0;i<n;i++){const e=document.createElement('span');e.className='burst';e.textContent=['❤','💛','🌸','✨','☀️'][i%5];
 const a=Math.random()*Math.PI*2,d=70+Math.random()*130;e.style.left=x+'px';e.style.top=y+'px';
 e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',Math.sin(a)*d-40+'px');e.style.setProperty('--r',(Math.random()*120-60)+'deg');
 document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}}
$('#seal').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,22);
  setTimeout(()=>$('#letter-stage').scrollIntoView({behavior:reduce?'auto':'smooth'}),350)};
$('#hugBtn').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();burst(r.left+r.width/2,r.top,30)};

/* reveal on scroll (also re-observes paragraphs) */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(n=>io.observe(n));

render(false);
</script>
</body>
</html>
